# This is a full-line comment describing the entire file.

# Path to the legacy dataset
misc:
   seed: 0

classification:
  data_base_path: "/home/datasets/" # Path to the classification dataset base directory.
  target_class_list:
    - 'deer'
    - 'horse'
    - 'zebra'


  linear_classifier_type: 'SGDClassifier' # Specifies the type of linear classifier to use.
  lambda_aligns: [ 0.5, 0.6]

# --- CONCEPT CONFIGURATIONS ---
# This section defines the paths for various concepts.
concept:
  base_path: '/home/concept'
  target_folders:
    - 'deer/coat'
    - 'horse/horse_skin'
    - 'zebra/stripes'
    
  random_folder: '/home/concept/random'

hyperparameters:
  learning_rate: 1e-03
  epochs: 30
  batch_size: 64
  
# --- MODEL CONFIGURATIONS ---
# This section specifies model-specific settings, including layers to train.  
recalibration:
  override_retraining: true
  layers_to_train:
    vgg16:
      - 'features.17'
      - 'features.19'
      - 'features.20'
      - 'features.21'
      - 'features.22'
      - 'features.23'

    inception_v3:
      - 'Mixed_6e.branch1x1.conv'
      - 'Mixed_6e.branch1x1'
      - 'Mixed_6e.branch7x7_1.conv'
      - 'Mixed_6e.branch7x7_2.conv'
      - 'Mixed_6e.branch7x7_3.conv'
      - 'Mixed_6e.branch7x7dbl_1.conv'
      - 'Mixed_7b.branch1x1.conv'
      - 'Mixed_7b.branch3x3_1.conv'
      - 'Mixed_7b.branch3x3_2a.conv'
      - 'Mixed_7b.branch3x3_2b.conv'
      - 'Mixed_7b.branch3x3dbl_3a'
      - 'Mixed_7b.branch_pool.conv'
      

    resnet50:
      - 'layer1.1.conv2'
      - 'layer1.1.conv3'
      - 'layer2.0.conv2'
      - 'layer2.1.conv3'
      - 'layer2.2.conv1'
      - 'layer2.2.conv3'
      - 'layer2.3.conv1'
      - 'layer2.3.conv2'
      - 'layer3.0.conv2'
      - 'layer3.0.conv3'
      - 'layer3.0.downsample.0'
      - 'layer3.1.conv1'
      - 'layer3.1.conv3'
      - 'layer3.2.conv1'
      - 'layer3.3.conv1'
      - 'layer3.3.conv2'
      - 'layer3.3.conv3'
      - 'layer3.4.conv1'
      - 'layer3.4.conv2'
      - 'layer3.4.conv3'
      - 'layer3.5.conv3'
      - 'layer4.0.conv1'
      - 'layer4.0.conv2'
      - 'layer4.0.conv3'
      - 'layer4.0.downsample.0'
      - 'layer4.1.conv1'
      - 'layer4.1.conv2'
      - 'layer4.1.conv3'
      - 'layer4.2.conv1'
      - 'layer4.2.conv2'
      - 'layer4.2.conv3'
      
      

    mobilnet_v3_small:
      - 'features.1.block.0.0'
      - 'features.5.block.0.0'
      - 'features.5.block.3.0'
      - 'features.6.block.3.0'
      - 'features.7.block.3.0'
      - 'features.8.block.0.0'
      - 'features.8.block.2.fc2'
      - 'features.8.block.3.0'
      - 'features.9.block.1.0'
      - 'features.9.block.2.fc1'
      - 'features.9.block.3.0'
      - 'features.10.block.3.0'
      - 'features.11.block.3.0'

    mobilenet_v3_large:
      - 'features.11.block.2.fc1'
      - 'features.11.block.2.fc2'
      - 'features.12.block.2.fc1'
      - 'features.12.block.2.fc2'
      - 'features.13.block.2.fc1'
      - 'features.13.block.2.fc2'
      - 'features.14.block.2.fc1'
      - 'features.14.block.2.fc2'
      - 'features.15.block.2.fc1'
      - 'features.15.block.2.fc2'
      - 'features.16.0'
    
  lambda_aligns_recalib: [0.5, 0.6]
  #lambda_aligns_recalib: [0.5]
# --- END OF CONFIGURATIONS ---

