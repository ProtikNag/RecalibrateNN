# This is a full-line comment describing the entire file.

# Path to the caltech dataset
misc:
   seed: 0

classification:
  data_base_path: "/mnt/sdc/data/caltech/CUB_200_2011/cub_dataset/tenclasses/" # Path to the classification dataset base directory.
  target_class_list:
    - '001.Black_footed_Albatross'
    - '002.Laysan_Albatross'
    - '003.Sooty_Albatross'
    - '004.Groove_billed_Ani'
    - '005.Crested_Auklet'
    - '006.Least_Auklet'
    - '007.Parakeet_Auklet'
    - '008.Rhinoceros_Auklet'
    - '009.Brewer_Blackbird'
    - '010.Red_winged_Blackbird'

  linear_classifier_type: 'SGDClassifier' # Specifies the type of linear classifier to use.
  lambda_aligns: [ 0.5, 0.6, 0.7, 0.8]

# --- CONCEPT CONFIGURATIONS ---
# This section defines the paths for various concepts.
concept:
  base_path: '/mnt/sdc/data/caltech/CUB_200_2011/CUB_200_2011/concepts/parts'
  target_folders:
    - '001.Black_footed_Albatross/forehead'
    - '002.Laysan_Albatross/forehead'
    - '003.Sooty_Albatross/forehead'
    - '004.Groove_billed_Ani/forehead'
    - '005.Crested_Auklet/forehead'
    - '006.Least_Auklet/forehead'
    - '007.Parakeet_Auklet/forehead'
    - '008.Rhinoceros_Auklet/forehead'
    - '009.Brewer_Blackbird/forehead'
    - '010.Red_winged_Blackbird/forehead'
    
  random_folder: '/home/concept/random'

hyperparameters:
  learning_rate: 1e-03
  epochs: 30
  batch_size: 64
  
# --- MODEL CONFIGURATIONS ---
# This section specifies model-specific settings, including layers to train.  
recalibration:
  override_retraining: false
  layers_to_train:
    vgg16:
      #- 'features.7'
      - 'features.19'
      - 'features.20'
      #- 'features.21'
      - 'features.22'
      - 'features.23'
      - 'features.24'
      #- 'features.25'
      #- 'features.26'
      #- 'features.27'
      #- 'features.28'

    inception_v3:
      - 'Mixed_6e.branch1x1.conv'
      - 'Mixed_6e.branch1x1'
      - 'Mixed_6e.branch7x7_1.conv'
      - 'Mixed_6e.branch7x7_2.conv'
      - 'Mixed_6e.branch7x7_3.conv'
      - 'Mixed_6e.branch7x7dbl_1.conv'
      - 'Mixed_7b.branch1x1.conv'
      - 'Mixed_7b.branch3x3_1.conv'
      - 'Mixed_7b.branch3x3_2a.conv'
      - 'Mixed_7b.branch3x3_2b.conv'
      - 'Mixed_7b.branch3x3dbl_3a'
      - 'Mixed_7b.branch_pool.conv'
      

    resnet50:
      #- 'layer1.0.conv1'
      #- 'layer1.0.conv2'
      #- 'layer1.0.conv3'
      #- 'layer4.0.conv1'
      #- 'layer4.0.conv2'
      #- 'layer4.0.conv3'
      - 'layer4.1.conv1'
      #- 'layer4.1.conv2'
      #- 'layer4.1.conv3'
      #- 'layer4.2.conv1'
      #- 'layer4.2.conv2'
      #- 'layer4.2.conv3'
      
      

    mobilnet_v3_small:
      - 'features.5.block.0.0'
      - 'features.5.block.1.0'
      - 'features.5.block.2.fc2'
      - 'features.5.block.3.0'
      - 'features.6.block.0.0'
      - 'features.6.block.1.0'
      - 'features.6.block.2.fc2'
      - 'features.6.block.3.0'
      - 'features.7.block.0.0'
      - 'features.7.block.1.0'
      - 'features.7.block.2.fc2'
      - 'features.7.block.3.0'
      - 'features.15.block.2.fc1'
      

    mobilenet_v3_large:
      - 'features.11.block.2.fc1'
      - 'features.11.block.2.fc2'
      - 'features.12.block.2.fc1'
      - 'features.12.block.2.fc2'
      - 'features.13.block.2.fc1'
      - 'features.13.block.2.fc2'
      - 'features.14.block.2.fc1'
      - 'features.14.block.2.fc2'
      - 'features.15.block.2.fc1'
      - 'features.15.block.2.fc2'
      - 'features.16.0'

  #lambda_aligns_recalib: [0.5, 0.6,] 
  lambda_aligns_recalib: [0.5, 0.6, 0.7, 0.8]
  #lambda_aligns_recalib: [0.5]
# --- END OF CONFIGURATIONS ---

# Note all the XAI images can be captured here for before after comparison
xai_before_after:
  integrated_gradients: true
  grad_cam: true
  lime: false
  num_classes: 3
  class_images:
    class0:
      - '/mnt/data/caltech_training/train/001.Black_footed_Albatross/Black_Footed_Albatross_0001_796111.jpg'
    class1:
      - '/mnt/data/caltech_training/train/002.Laysan_Albatross/Laysan_Albatross_0001_545.jpg'
      - '/mnt/data/caltech_training/train/002.Laysan_Albatross/Laysan_Albatross_0104_630.jpg'
    class2:
      - '/mnt/data/caltech_training/train/003.Sooty_Albatross/Sooty_Albatross_0001_1071.jpg'
