misc:
   seed: 0

classification:
  # Path to the classification dataset base directory.  
  data_base_path: 'Enter path of the dataset here'
  target_class_list:
    - "001.Black_footed_Albatross"
    - "002.Laysan_Albatross"
    - "003.Sooty_Albatross"
    - "004.Groove_billed_Ani"
    - "005.Crested_Auklet"
    - "006.Least_Auklet"
    - "007.Parakeet_Auklet"
    - "008.Rhinoceros_Auklet"
    - "009.Brewer_Blackbird"
    - "010.Red_winged_Blackbird"
  linear_classifier_type: "SGDClassifier" # Specifies the type of linear classifier to use.
  lambda_aligns: [ 0.5, 0.6, 0.7, 0.8]

# --- CONCEPT CONFIGURATIONS ---
# This section defines the paths for various concepts.
concept:
  base_path: 'Enter path of the concepts'
  target_folders:
    - '001.Black_footed_Albatross/beak"
    - '002.Laysan_Albatross/beak"
    - '003.Sooty_Albatross/beak"
    - '004.Groove_billed_Ani/beak"
    - '005.Crested_Auklet/beak"
    - '006.Least_Auklet/beak"
    - '007.Parakeet_Auklet/beak"
    - '008.Rhinoceros_Auklet/beak"
    - '009.Brewer_Blackbird/beak"
    - '010.Red_winged_Blackbird/beak"
	
  random_folder: "Enter path of the random here"

hyperparameters:
  learning_rate: 1e-03
  epochs: 30
  batch_size: 64
  
# --- MODEL CONFIGURATIONS ---
# This section specifies model-specific settings, including layers to train.  
recalibration:
  override_retraining: true

  layers_to_train:

    vgg16:
      - 'features.23'
      - 'features.24'
      - 'features.25'
      - 'features.26'
      - 'features.27'
      - 'features.28'

    inception_v3:
      - 'Mixed_6e.branch1x1.conv'
      - 'Mixed_6e.branch1x1'
      - 'Mixed_6e.branch7x7_1.conv'
      - 'Mixed_6e.branch7x7_2.conv'
      - 'Mixed_6e.branch7x7_3.conv'
      - 'Mixed_6e.branch7x7dbl_1.conv'
      - 'Mixed_7b.branch1x1.conv'
      - 'Mixed_7b.branch3x3_1.conv'
      - 'Mixed_7b.branch3x3_2a.conv'
      - 'Mixed_7b.branch3x3_2b.conv'
      - 'Mixed_7b.branch3x3dbl_3a'
      - 'Mixed_7b.branch_pool.conv'

    resnet50:
      - 'layer1.0.conv1'
      - 'layer1.0.conv2'
      - 'layer1.0.conv3'
      - 'layer4.0.conv1'
      - 'layer4.0.conv2'
      - 'layer4.0.conv3'
      - 'layer4.1.conv1'
      - 'layer4.1.conv2'
      - 'layer4.1.conv3'
      - 'layer4.2.conv1'
      - 'layer4.2.conv2'
      - 'layer4.2.conv3'

    mobilnet_v3_small:
      - 'features.5.block.0.0'
      - 'features.5.block.1.0'
      - 'features.6.block.1.0'
      - 'features.7.block.3.0'

    mobilenet_v3_large:
      - 'features.13.block.2.fc1'
      - 'features.14.block.2.fc1'
      - 'features.14.block.2.fc2'
    
  lambda_aligns_recalib: [0.5, 0.6]

# --- END OF CONFIGURATIONS ---

# Note all the XAI images can be captured here for before after comparison
# Add atleast 1 file for the explainable AI comparison. 
xai_before_after:
  integrated_gradients: true
  grad_cam: true
  lime: true
  num_classes: 4
  class_images:
    class0:
      - 'image1.jpg'
      - 'image2.jpg'
    class1:
      - 'image1.jpg'
      - 'image2.jpg'
    class2:
      - 'image1.jpg'
      - 'image2.jpg'
    class4:
      - 'image1.jpg'
      - 'image2.jpg'

