# --- RECALIBRATION WEIGHTS ---
# Configurable per-class and per-concept weights used by
# main_recalib_custom_by_loading_cav.py to perform a targeted, weighted
# multi-concept recalibration. Concept names below must match the
# "concept_name" keys recorded in the per-model manifest
# (e.g. <model_name>_manifest.json produced by main_store_cav.py).
#
# class_weight     : overall scaling applied to the class's combined
#                    alignment loss (defaults to 1.0 if omitted).
# concept_weights  : relative weight of each concept's alignment loss for
#                    that class. Any concept from the manifest not listed
#                    here automatically receives an equal share of the
#                    remaining weight (so weights always sum to 1.0).
recalibration_weights:
  class0:
    class_weight: 1.0
    concept_weights:
      deer_coat: 0.4
      deer_background: 0.2
      deer_face: 0.2
      deer_legs: 0.2

  class1:
    class_weight: 1.0
    concept_weights:
      horse_coat: 0.4
      horse_background: 0.2
      horse_face: 0.2
      horse_legs: 0.2

  class2:
    class_weight: 1.0
    concept_weights:
      zebra_coat: 0.4
      zebra_background: 0.2
      zebra_face: 0.2
      zebra_legs: 0.2

hyperparameters:
  learning_rate: 1e-03
  epochs: 30
  batch_size: 64
  
# --- MODEL CONFIGURATIONS ---
# This section specifies model-specific settings, including layers to train.  
recalibration:
  override_retraining: true
  layers_to_train:
    vgg16:
      - 'features.17'
      - 'features.21'
      - 'features.24'

