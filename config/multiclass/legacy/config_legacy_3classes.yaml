# This is a full-line comment describing the entire file.

# Path to the legacy dataset
misc:
   seed: 131

classification:
  data_base_path: "/home/balanced_dataset/" # Path to the classification dataset base directory.
  target_class_list:
    - 'deer'
    - 'horse'
    - 'zebra'


  linear_classifier_type: 'SGDClassifier' # Specifies the type of linear classifier to use.
  lambda_aligns: [0.4, 0.5, 0.6, 0.7, 0.8 ]

# --- CONCEPT CONFIGURATIONS ---
# This section defines the paths for various concepts.

concept:
  base_path: "/mnt/sdc/concepts/concepts_links/concept_150"
  target_folders:
    - "deer/coat"
    - "horse/coat"
    - "zebra/coat"
  random_folder: "/mnt/sdc/concepts/concepts_links/concept_150/random"

multiconcept:
  base_path: "/mnt/sdc/concepts/concepts_links"
  random_folder_base_path: "/mnt/sdc/concepts/concepts_links/concept_150"
  class0:
    target_folders:
      - "concept_150/deer/coat"
      - "concept_150/deer/background"
      - "concept_150/deer/face"
      - "concept_150/deer/legs"
    random_folders:
      - "random"
      - "random"
      - "random"
      - "random"

  class1:
    target_folders:
      - "concept_150/horse/coat"
      - "concept_150/horse/background"
      - "concept_150/horse/face"
      - "concept_150/horse/legs"
    random_folders:
      - "random"
      - "random"
      - "random"
      - "random"

  class2:
    target_folders:
      - "concept_150/zebra/coat"
      - "concept_150/zebra/background"
      - "concept_150/zebra/face"
      - "concept_150/zebra/legs"
    random_folders:
      - "random"
      - "random"
      - "random"
      - "random"

