[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: fast, pure in-process unit tests (no subprocess, no training)
    integration: full CLI subprocess tests that exercise a target script end-to-end
    slow: slower tests (small training loops); still fast enough for CI (<a few minutes total)
addopts = -ra
